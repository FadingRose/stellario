[package]
name = "stellario-engine"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
# CRDT storage — the data plane foundation.
automerge = "0.10"
autosurgeon = "0.12"
# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1"
# CLI / errors.
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Date handling (entry.created/updated are YYYY-MM-DD).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Content-addressing for versions (volume:id:hash).
sha2 = "0.11"
hex = "0.4"
# Semantic search — same ONNX MiniLM weights as the TS pipeline (numerically equivalent).
fastembed = "4"
# SIGPIPE reset (product surface: `stella ... | head` must not panic).
libc = "0.2"
# Index plane (Phase 4) — embedded single-file vector store.
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
# MCP server (official SDK, stdio transport).
rmcp = { version = "3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }

[lib]
name = "stellario"
path = "src/lib.rs"

[[bin]]
name = "stellario-migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "stellario-mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "stellario"
path = "src/bin/stellario.rs"

[[bin]]
name = "stella"
path = "src/bin/stella.rs"

[profile.release]
# Smaller binaries for distribution.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
