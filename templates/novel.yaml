# ╭───────────────────────────────────────────────────────────────────────────╮
# │  Stellario — Novel Writing Config                                       │
# │                                                                          │
# │  8 volumes, 5 agents. Designed for multi-agent fiction writing.          │
# │  A lead agent orchestrates; specialists handle worldbuilding, prose,     │
# │  continuity checking, and character management.                          │
# │                                                                          │
# │  Every field is commented so you (and your agents) can understand and    │
# │  modify this config without reading external docs.                       │
# ╰───────────────────────────────────────────────────────────────────────────╯

# Where memory data lives (relative to project root).
memoryDir: ".opencode/.writer-memory"

# ── Volumes ────────────────────────────────────────────────────────────────
#
# A volume is a named container for memory entries. Each volume has a
# "profile" that determines how entries behave, and "boundaries" that
# control which agents can access it.
#
# Profiles:
#   mutable    — Entries can be created, edited, and archived.
#                Use for: evolving knowledge, design decisions, notes.
#                Entries get stable IDs like "a01", "a02", tracked in git.
#
#   append     — Entries can be created but never edited or deleted.
#                Use for: handoff logs, session records, audit trails.
#                Once written, it's permanent.
#
#   scratch    — Like mutable, but NOT tracked in git.
#                Use for: drafts, experiments, throwaway notes.
#                Entries get random IDs like "d7f3a". Gone if file is deleted.
#
#   frozen     — Completely read-only. No creation, no edits, no deletion.
#                Use for: the archive volume where forgotten entries land.
#                You should always have one "archived" volume with this profile.
#
#   workspace  — Like mutable, but also tracks which entry is "active".
#                Use for: the agent's current task context.
#                Only ONE workspace volume allowed per project.
#
# Authority (optional semantic label — does NOT affect behavior):
#   source      — Raw material from external input (conversations, data)
#   curated     — Human-judged, high-value knowledge (decisions, conventions)
#   synthesized — Agent-derived, can be regenerated (summaries, patterns)
#
# Boundaries:
#   write: [agent1, agent2]  — which agents can create/edit entries
#   read:  [agent1, agent2]  — which agents can view entries
#   Use [all] to grant access to every defined agent.

volumes:
  # meta: behavioral calibrations and dynamic prompts.
  #   Entries here with tag "type:prompt" are injected into the agent's
  #   system context on session startup. Use for cross-session instructions.
  meta:
    profile: mutable
    boundaries:
      write: [stellario]
      read: [stellario]
    authority: curated
    idPrefix: "m"

  # active: the main knowledge base. Story decisions, conventions, notes.
  #   Readable by all agents so specialists can access story context.
  active:
    profile: mutable
    boundaries:
      write: [stellario]
      read: [all]
    authority: curated
    idPrefix: "a"

  # handover: session handoff logs. Immutable once written.
  #   The chronicler subagent can read these to recover narrative context.
  handover:
    profile: append
    boundaries:
      write: [stellario]
      read: [stellario, chronicler]
    authority: curated
    idPrefix: "h"

  # layer: the active workspace. Tracks what the agent is currently focused on.
  #   Both stellario and chronicler can write here for collaborative continuity.
  layer:
    profile: workspace
    boundaries:
      write: [stellario, chronicler]
      read: [stellario, chronicler]
    authority: curated
    idPrefix: "l"

  # drafting: temporary working material. Not git-tracked.
  #   The penna subagent uses this for prose drafts and scene experiments.
  drafting:
    profile: scratch
    boundaries:
      write: [stellario, penna]
      read: [stellario, chronicler, penna]
    authority: curated
    idPrefix: "d"

  # lore: the worldbuilding database. Entries MUST have a lore:* tag.
  #   Only the worldbuilder subagent writes here. Others read for consistency.
  lore:
    profile: mutable
    boundaries:
      write: [worldbuilder]
      read: [stellario, chronicler, worldbuilder, vilicus]
    authority: synthesized
    idPrefix: "s"
    requiredTagPrefix: "lore:"

  # animus: character profiles and arcs.
  #   Only the vilicus subagent writes here. Others read for reference.
  animus:
    profile: mutable
    boundaries:
      write: [vilicus]
      read: [stellario, vilicus, worldbuilder]
    authority: curated
    idPrefix: "n"

  # archived: where forgotten entries go. Read-only.
  archived:
    profile: frozen
    boundaries:
      read: [all]

# ── Agents ─────────────────────────────────────────────────────────────────
#
# Each agent is a persona that can interact with memory volumes.
#   display: human-readable name (shown in tool output and errors)
#   role:    "primary" = user-facing, can use task/edit/bash tools
#            "subagent" = dispatched internally by the primary agent
#
# The first agent listed is treated as the project lead.
# Agent names are used in volume boundaries above.

agents:
  stellario:
    display: "Stellario"
    role: primary
  chronicler:
    display: "Chronicler"
    role: subagent
  worldbuilder:
    display: "Worldbuilder"
    role: subagent
  penna:
    display: "Penna"
    role: subagent
  vilicus:
    display: "Vilicus"
    role: subagent

# ── Tags ───────────────────────────────────────────────────────────────────
#
# Structured categorization for entries. Tags use "namespace:value" format.
#   namespaces: allowed tag prefixes (informational, not enforced at engine level)
#   typeValues: closed vocabulary for type:* tags (helps agents pick the right tag)
#
# Examples: type:design, work:origins, chapter:06, arc:betrayal

tags:
  namespaces: [work, role, chapter, file, arc, type]
  typeValues: [handoff, design, locked, layer, convention, polish, role-card, role-baseline, role-memory, foreshadow, hidden-arc]

# ── Semantic Search (optional) ────────────────────────────────────────────
#
# embedding:
#   enabled: auto                          # auto (probe at runtime) | true | false
#   model: "Xenova/all-MiniLM-L6-v2"      # embedding model (~22MB, runs locally)
