# Stellario — Novel Writing Config
# 8 volumes, 5 agents

memoryDir: ".writer-memory"

volumes:
  meta:
    profile: mutable
    boundaries:
      write: [stellario]
      read: [stellario]
    authority: curated
    idPrefix: "m"
  active:
    profile: mutable
    boundaries:
      write: [stellario]
      read: [all]
    authority: curated
    idPrefix: "a"
  handover:
    profile: append
    boundaries:
      write: [stellario]
      read: [stellario, chronicler]
    authority: curated
    idPrefix: "h"
  layer:
    profile: workspace
    boundaries:
      write: [stellario, chronicler]
      read: [stellario, chronicler]
    authority: curated
    idPrefix: "l"
  drafting:
    profile: scratch
    boundaries:
      write: [stellario, penna]
      read: [stellario, chronicler, penna]
    authority: curated
    idPrefix: "d"
  lore:
    profile: mutable
    boundaries:
      write: [worldbuilder]
      read: [stellario, chronicler, worldbuilder, vilicus]
    authority: synthesized
    idPrefix: "s"
    requiredTagPrefix: "lore:"
  animus:
    profile: mutable
    boundaries:
      write: [vilicus]
      read: [stellario, vilicus, worldbuilder]
    authority: curated
    idPrefix: "n"
  archived:
    profile: frozen
    boundaries:
      read: [all]

agents:
  stellario:
    display: "Stellario"
    role: primary
  chronicler:
    display: "Chronicler"
    role: subagent
  worldbuilder:
    display: "Worldbuilder"
    role: subagent
  penna:
    display: "Penna"
    role: subagent
  vilicus:
    display: "Vilicus"
    role: subagent

tags:
  namespaces: [work, role, chapter, file, arc, type]
  typeValues: [handoff, design, locked, layer, convention, polish, role-card, role-baseline, role-memory, foreshadow, hidden-arc]
