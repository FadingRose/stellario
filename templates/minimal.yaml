# Stellario — Minimal Config
# For simple projects with a single agent

memoryDir: ".stellario"

volumes:
  active:
    profile: mutable
    boundaries:
      write: [stellario]
      read: [all]
  handover:
    profile: append
    boundaries:
      write: [stellario]
      read: [stellario]
  drafting:
    profile: scratch
    boundaries:
      write: [stellario]
      read: [stellario]
  workspace:
    profile: workspace
    boundaries:
      write: [stellario]
      read: [stellario]

agents:
  stellario:
    display: "Stellario"
    role: primary
