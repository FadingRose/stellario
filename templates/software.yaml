# Stellario — Software Development Config
# 6 volumes, 3 agents

memoryDir: ".stellario"

volumes:
  meta:
    profile: mutable
    boundaries:
      write: [stellario]
      read: [stellario]
    authority: curated
    idPrefix: "m"
  active:
    profile: mutable
    boundaries:
      write: [stellario]
      read: [all]
    authority: curated
    idPrefix: "a"
  handover:
    profile: append
    boundaries:
      write: [stellario]
      read: [stellario, analyst]
    authority: curated
    idPrefix: "h"
  layer:
    profile: workspace
    boundaries:
      write: [stellario, analyst]
      read: [stellario, analyst]
    authority: curated
    idPrefix: "l"
  drafting:
    profile: scratch
    boundaries:
      write: [stellario, executor]
      read: [stellario, analyst, executor]
    authority: curated
    idPrefix: "d"
  archived:
    profile: frozen
    boundaries:
      read: [all]

agents:
  stellario:
    display: "Stellario"
    role: primary
  analyst:
    display: "Analyst"
    role: subagent
  executor:
    display: "Executor"
    role: subagent

tags:
  namespaces: [module, feature, crate, file, type]
  typeValues: [handoff, design, adr, convention, layer, polish, bug, investigation]

